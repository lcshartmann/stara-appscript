<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
     :root {
        /* Primary Scale */
        --primary-50: #fef6f0;
        --primary-100: #fde8d9;
        --primary-200: #fcd5b8;
        --primary-300: #f9b88a;
        --primary-400: #f79557;
        --primary-500: #f36f21;
        --primary-600: #e55a0b;
        --primary-700: #c7460a;
        --primary-800: #9e360d;
        --primary-900: #7b2b0e;
        --primary-950: #470f02;

        /* Brand */
        --color-primary: var(--primary-500);
        --color-accent: #00a859;

        /* Backgrounds */
        --bg-primary: #ffffff;
        --bg-secondary: #f1f3f4;
        --bg-surface: #ffffff;
        --bg-muted: #e6e3e1;
        --bg-hover: #e6e3e1;

        /* Warm surfaces */
        --bg-warm: #fdf3eb;
        --bg-warm-hover: #f9e4d4;

        /* Status backgrounds */
        --bg-success: #e6f7ed;
        --bg-error: #fde8e8;
        --bg-warning: #fff4d6;
        --bg-info: #e3f2fd;

        /* Typography */
        --text-primary: #1f2328;
        --text-secondary: #5b6470;
        --text-muted: #8a94a6;

        /* Status colors */
        --success: #1db954;
        --success-dark: #148a3d;

        --error: #e53935;
        --error-dark: #b71c1c;

        --warning: #f9a825;
        --warning-dark: #f57f17;

        --info: #1e88e5;
        --info-dark: #1565c0;

        /* Font sizes */
        --font-xs: 11px;
        --font-sm: 13px;
        --font-md: 14px;
        --font-lg: 16px;
        --font-xl: 20px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg-secondary);
        color: var(--text-primary);
        font-family: "Geist", sans-serif;
        line-height: 1.5;
      }

      /* Layout */

      .layout {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .app {
        display: none;
        flex-direction: column;
        height: 100vh;
      }

      .main {
        flex: 1;
        display: flex;
        margin: 30px;
        overflow: hidden;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px;
      }

      .content {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        background: var(--bg-primary);
        max-width: 60vw;
        margin: 0 auto;
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        border: 1px solid #e6e8ec;
        border-radius: 1%;
      }

      .sidebar {
        width: 240px;
        background: var(--bg-surface);
        border-right: 1px solid #e6e8ec;
      }

      /* Cards */

      .card {
        background: var(--bg-surface);
        border-radius: 12px;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        padding: 16px;
      }

      .panel {
        background: var(--bg-surface);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e6e8ec;
      }

      .panel-header {
        padding: 14px 16px;
        border-bottom: 1px solid #eef0f3;
        font-weight: 500;
      }

      .panel-body {
        padding: 16px;
      }

      .placeholder {
        background: var(--bg-surface);
        border-radius: 12px;
        padding: 40px 24px;
        text-align: center;
        color: var(--text-muted);
      }

      /* Navigation */

      .nav {
        display: flex;
        overflow-x: auto;
        background: var(--bg-surface);
        box-shadow: rgba(100, 100, 111, 0.2) 0px 7px 29px 0px;
        border-bottom: 1px solid #e6e8ec;
      }

      .nav-item {
        padding: 12px 20px;
        font-size: var(--font-sm);
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }

      .nav-item:hover {
        background: var(--bg-warm);
      }

      .nav-item.active {
        color: var(--color-primary);
        border-bottom-color: var(--color-primary);
        background: var(--bg-warm);
      }

      /* Buttons */

      .btn {
        font-family: "Geist", sans-serif;
        border: none;
        border-radius: 8px;
        padding: 8px 14px;
        font-size: var(--font-sm);
        font-weight: 500;
        cursor: pointer;
        transition: .15s;
      }

      .btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn:disabled {
        opacity: .6;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--color-primary);
        color: white;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--primary-600);
      }

      .btn-secondary {
        background: var(--bg-muted);
        color: var(--text-primary);
      }

      .btn-secondary:hover:not(:disabled) {
        background: var(--bg-hover);
      }

      .btn-accent {
        background: var(--color-accent);
        color: white;
      }

      .btn-accent:hover:not(:disabled) {
        background: #009245;
      }

      .btn-danger {
        background: var(--error);
        color: white;
      }

      .btn-danger:hover:not(:disabled) {
        background: var(--error-dark);
      }

      .btn-loader {
        display: inline-block;
        width: 14px;
        height: 14px;
        margin-right: 8px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.3);
        border-top-color: white;
        animation: spin .6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Forms */

      input,
      select,
      textarea {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #dadce0;
        background: var(--bg-surface);
        color: var(--text-primary);
        font-size: var(--font-md);
        font-family: "Geist", sans-serif;
        outline: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(243,111,33,.1);
      }

      textarea {
        resize: vertical;
        min-height: 100px;
      }

      .field {
        margin-bottom: 14px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: var(--font-sm);
        font-weight: 500;
        color: var(--text-secondary);
      }

      /* Tables */

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: var(--font-sm);
      }

      th {
        padding: 10px;
        text-align: left;
        font-size: var(--font-xs);
        text-transform: uppercase;
        font-weight: 600;
        color: var(--text-secondary);
        background: var(--bg-muted);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid #eef0f3;
      }

      tr:hover {
        background: var(--bg-warm);
      }

      /* Alerts */

      .alert {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        margin-bottom: 14px;
        border-radius: 8px;
        font-size: var(--font-sm);
      }

      .alert-success {
        background: var(--bg-success);
        color: var(--success-dark);
      }

      .alert-error {
        background: var(--bg-error);
        color: var(--error-dark);
      }

      .alert-warning {
        background: var(--bg-warning);
        color: var(--warning-dark);
      }

      .alert-info {
        background: var(--bg-info);
        color: var(--info-dark);
      }

      /* Badges */

      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: var(--font-xs);
        font-weight: 500;
      }

      .badge-success {
        background: var(--bg-success);
        color: var(--success-dark);
      }

      .badge-error {
        background: var(--bg-error);
        color: var(--error-dark);
      }

      .badge-warning {
        background: var(--bg-warning);
        color: var(--warning-dark);
      }

      .badge-info {
        background: var(--bg-info);
        color: var(--info-dark);
      }

      /* Typography */

      h1,h2,h3,h4,h5,h6 {
        margin: 0 0 12px;
        font-weight: 600;
      }

      h1 { font-size: 28px; }
      h2 { font-size: 24px; }
      h3 { font-size: 20px; }
      h4 { font-size: var(--font-lg); }

      .content-title {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 600;
      }

      .content-subtitle {
        margin: 0;
        font-size: var(--font-sm);
        color: var(--text-secondary);
      }

      .subtitle {
        margin: 0 0 20px;
        font-size: var(--font-sm);
        color: var(--text-secondary);
      }

      p {
        margin: 0 0 12px;
      }

      /* Branding */

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        object-fit: cover;
      }

      .brand-title {
        font-size: 18px;
        font-weight: 600;
      }

      /* Utilities */

      .text-center { text-align: center; }
      .text-muted { color: var(--text-muted); }
      .text-secondary { color: var(--text-secondary); }

      .flex { display: flex; }
      .flex-col { flex-direction: column; }

      .items-center { align-items: center; }

      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }

      .gap-1 { gap: 8px; }
      .gap-2 { gap: 12px; }
      .gap-3 { gap: 16px; }

      .mt-1 { margin-top: 8px; }
      .mt-2 { margin-top: 12px; }
      .mt-3 { margin-top: 16px; }
      .mt-4 { margin-top: 20px; }

      .mb-1 { margin-bottom: 8px; }
      .mb-2 { margin-bottom: 12px; }
      .mb-3 { margin-bottom: 16px; }
      .mb-4 { margin-bottom: 20px; }

            .helper {
        margin-top: 14px;
        text-align: center;
        color: var(--text-muted);
        font-size: var(--font-xs);
      }

      /* Dynamic Form Styles */
      .form-group {
        border: 1px solid #e6e8ec;
        padding: 16px;
        border-radius: 8px;
        margin-bottom: 16px;
      }
      .form-group-title {
        font-weight: 600;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .dynamic-list {
        list-style: none;
        padding: 0;
      }
      .dynamic-item {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }

      /* Admin.html
      */
      .header {
        background: var(--primary-600);
        border-bottom: 1px solid #e6e8ec;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
        flex: 1;
      }

      .header-logo {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
      }

      .header-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .header-brand {
        font-size: 12px;
        color: white;
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .header-subtitle {
        font-size: 16px;
        font-weight: 600;
        color: white;
      }

      .header-right {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-name {
        font-size: var(--font-sm);
        font-weight: 500;
        color: var(--text-primary);
      }

      .user-role {
        font-size: 11px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <?!= include('ui/Login'); ?>
    <?!= include('ui/Admin'); ?>
  </body>
</html>
